<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Nicotine Pouch Tracker.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#10b981">
  <link rel="manifest" href="./manifest.json">
  <title>NicoTracker Ultimate</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --primary: #10b981; --primary-dark: #059669; --danger: #ef4444; --border: #e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding-bottom:60px; -webkit-tap-highlight-color:transparent; }
    .shell { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
    
    /* Header & Card */
    header { background:var(--card); border-bottom:1px solid var(--border); padding:16px 20px; position:sticky; top:0; z-index:50; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:800; font-size:20px; color:var(--text); display:flex; align-items:center; gap:6px; }
    .logo span { color:var(--primary); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.05); }
    
    /* Buttons */
    .btn { border:none; border-radius:10px; padding:10px 16px; font-weight:600; cursor:pointer; font-size:14px; transition:0.2s; display:inline-flex; align-items:center; gap:6px; }
    .btn-primary { background:var(--primary); color:white; }
    .btn-outline { background:white; border:1px solid var(--border); color:var(--text); }
    .btn:active { transform:scale(0.98); }
    
    /* Grid & Stats */
    .grid { display:grid; gap:12px; }
    .stats-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .stat { border:1px solid var(--border); border-radius:12px; padding:10px; background:white; }
    .stat .val { font-size:20px; font-weight:800; margin-top:2px; }
    .stat .lbl { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; }
    .stat .sub { font-size:11px; color:var(--muted); margin-top:2px; }
    
    /* Search & Selection Styles */
    .selector-btn { width: 100%; text-align: left; background: white; border: 1px solid var(--border); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-family: inherit; font-size: 14px; color: var(--text); cursor: pointer; }
    .selector-btn:active { background: #f8fafc; }
    .quick-actions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
    .quick-chip { flex-shrink: 0; background: #ecfdf5; color: var(--primary-dark); border: 1px solid #a7f3d0; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
    
    /* Search Modal (Centered & Green) */
    #searchModal { 
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; bottom: auto;
        height: 80vh; max-height: 600px; width: min(500px, 90vw); 
        border-radius: 16px; border: 2px solid var(--primary); /* GREEN BORDER */
        box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: popIn 0.2s ease-out; padding: 0;
    }
    @keyframes popIn { from { opacity:0; transform:translate(-50%, -45%) scale(0.95); } to { opacity:1; transform:translate(-50%, -50%) scale(1); } }
    
    .search-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; background: white; }
    #searchInput { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); font-size: 16px; outline: none; background: #f8fafc; }
    #searchInput:focus { border-color: var(--primary); background: white; }
    .search-results { overflow-y: auto; height: calc(100% - 74px); padding: 0 16px 20px; background: white; }
    .search-item { padding: 12px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .search-item:hover { background: #f8fafc; }
    .mg-badge { background: #f1f5f9; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--text); }

    /* Other UI */
    details > summary { list-style: none; cursor: pointer; font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    details > summary::after { content: '▼'; font-size: 12px; color: var(--muted); transition: transform 0.2s; }
    details[open] > summary::after { transform: rotate(180deg); }
    .history-item { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .quit-active { border: 2px solid var(--primary); background: #ecfdf5; }
    .progress-bar { height:6px; background:#e2e8f0; border-radius:3px; margin-top:8px; overflow:hidden; }
    .progress-fill { height:100%; background:var(--primary); width:0%; transition:width 0.5s; }
    .hidden { display:none !important; }
    
    /* Utils */
    dialog:not(#searchModal) { border:none; border-radius:16px; padding:20px; width:min(500px,95vw); box-shadow:0 20px 50px rgba(0,0,0,0.2); }
    dialog::backdrop { background:rgba(0,0,0,0.5); backdrop-filter:blur(2px); }
    #toast { position:fixed; bottom:20px; right:20px; z-index:100; }
    .toast-msg { background:#1e293b; color:white; padding:12px 20px; border-radius:10px; margin-top:10px; animation:slideUp 0.3s; }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .selection-card { border: 2px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; text-align: center; }
    .selection-card.active { border-color: var(--primary); background-color: #ecfdf5; }
    
    /* Health */
    .health-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
    .health-done { color: var(--text); } .health-done .health-icon { color: var(--primary); }
    .health-locked { color: var(--muted); filter: grayscale(1); opacity: 0.7; }
    
    /* Achievements */
    .achievements { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .achievement { padding: 12px; border: 1px solid var(--border); border-radius: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 110px; }
    .achievement.unlocked { background: #ecfdf5; border-color: #6ee7b7; }
    .achievement.locked { opacity: 0.5; background: #f1f5f9; border-style: dashed; filter: grayscale(1); }
  </style>
</head>
<body>

  <header>
    <div class="logo">💊 <span>NicoTracker</span></div>
    <div style="display:flex; gap:10px;">
      <button id="installBtn" class="btn btn-primary hidden" style="padding:8px 12px; font-size:12px;">📲 Install</button>
      <button id="langBtn" class="btn btn-outline" style="padding:8px;">🇺🇸 EN</button>
      <button id="syncBtn" class="btn btn-primary" data-i18n="auth_btn">Sync</button>
      <button id="menuBtn" class="btn btn-outline" style="font-size:18px;">⚙️</button>
    </div>
  </header>

  <main class="shell">
    
    <!-- Quit Banner -->
    <div id="quitBanner" class="card quit-active hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><h3 style="margin:0" data-i18n="quit_title">Freedom Journey</h3><p style="margin:4px 0 0; color:var(--primary-dark); font-size:13px;" data-i18n="quit_status_active">Active</p></div>
        <div style="text-align:right;"><div class="val" style="font-size:20px;" id="quitTarget">0</div><div class="lbl" data-i18n="daily_max">Max</div></div>
      </div>
      <div class="progress-bar"><div id="quitProgress" class="progress-fill"></div></div>
    </div>

    <!-- Dashboard Stats -->
    <div class="grid stats-grid">
      <div class="stat"><div class="lbl" data-i18n="today_usage">Today</div><div class="val" id="valToday">0</div><div class="sub" id="valLimit">Limit: 10</div></div>
      <div class="stat"><div class="lbl" data-i18n="streak">Streak</div><div class="val" id="valStreak">0</div><div class="sub" data-i18n="streak_hint">🔥 Keep it up</div></div>
      <div class="stat"><div class="lbl" data-i18n="money_saved">Saved</div><div class="val" id="valSaved" style="color:var(--primary);">0</div><div class="sub" id="valCost">Cost: 0</div></div>
      <div class="stat"><div class="lbl" data-i18n="nicotine">Nicotine</div><div class="val" id="valMg">0 mg</div><div class="sub" data-i18n="total_today">Total today</div></div>
    </div>

    <!-- Health Recovery -->
    <details id="healthSection" class="card hidden">
      <summary><span data-i18n="health_timeline">Health Recovery</span></summary>
      <div class="content" id="healthList"></div>
    </details>

    <!-- LOG USAGE -->
    <div class="card" style="margin-top:4px;">
      <h3 style="margin:0 0 12px;" data-i18n="log_usage">Log Usage</h3>
      <div id="quickActions" class="quick-actions"></div>
      <div class="grid" style="grid-template-columns: 1fr auto;">
        <button id="openSearchBtn" class="selector-btn">
          <div><div style="font-size:11px; color:var(--muted);" data-i18n="selected_pouch">Selected</div><div id="selectedPouchName" style="font-weight:700;">...</div></div>
          <span style="font-size:18px;">🔍</span>
        </button>
        <button id="addBtn" class="btn btn-primary" style="height:50px; width:60px; justify-content:center; font-size:24px;">➕</button>
      </div>
    </div>

    <!-- Achievements -->
    <details class="card">
        <summary><span data-i18n="achievements">Achievements</span></summary>
        <div class="content"><div id="badgeGrid" class="achievements"></div></div>
    </details>

    <!-- Charts -->
    <details class="card" open>
      <summary><span data-i18n="charts_title">Analytics</span></summary>
      <div class="content grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
        <div><h4 style="margin:0 0 10px; font-size:12px; color:var(--muted);" data-i18n="chart_trend">Trend</h4><canvas id="trendChart" height="200"></canvas></div>
        <div><h4 style="margin:20px 0 10px; font-size:12px; color:var(--muted);" data-i18n="hourly_heatmap">Heatmap</h4><canvas id="hourlyChart" height="200"></canvas></div>
      </div>
    </details>

    <!-- History -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <h3 style="margin:0;" data-i18n="history">History</h3>
        <button id="viewAllHistoryBtn" class="btn btn-outline" style="padding:6px 10px; font-size:12px;" data-i18n="view_all">View All</button>
      </div>
      <div id="historyList"></div>
    </div>

  </main>

  <div id="toast"></div>

  <!-- MODALS -->
  <dialog id="searchModal">
    <div class="search-header">
      <input type="search" id="searchInput" placeholder="..." autocomplete="off">
      <button class="btn btn-outline" style="border:none; font-size:20px; padding:0 10px;" onclick="document.getElementById('searchModal').close()">✕</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <dialog id="historyModal">
    <div class="modal-head"><span data-i18n="history_modal_title">Full History</span></div>
    <div class="modal-body grid" style="gap:12px;">
      <div><label style="font-size:12px; color:var(--muted);" data-i18n="pick_date">Pick Date</label><input type="datetime-local" id="backdateInput" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;"></div>
      <div style="font-size:12px; color:var(--muted);" data-i18n="past_entry_help">...</div>
      <button id="addPastEntryBtn" class="btn btn-primary" style="width:100%;" data-i18n="add_past_entry">Add</button>
      <div style="border-top:1px solid var(--border); margin:8px 0;"></div>
      <div id="fullHistoryList" style="max-height:300px; overflow-y:auto;"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="document.getElementById('historyModal').close()" data-i18n="close">Close</button></div>
  </dialog>

  <dialog id="settingsModal">
    <div class="modal-head"><span data-i18n="settings">Settings</span></div>
    <div class="modal-body">
      <div id="step1">
        <h3 style="margin:0 0 10px; font-size:14px;" data-i18n="wiz_step1_title">Goal</h3>
        <div class="grid" style="grid-template-columns: 1fr 1fr;">
          <div class="selection-card" data-val="track" onclick="selectGoal('track')"><div style="font-size:24px;">📊</div><h4 data-i18n="goal_track_title">Track</h4></div>
          <div class="selection-card" data-val="quit" onclick="selectGoal('quit')"><div style="font-size:24px;">💪</div><h4 data-i18n="goal_quit_title">Quit</h4></div>
        </div>
      </div>
      <div style="margin-top:20px; border-top:1px solid #eee; padding-top:10px;">
          <div class="grid" style="grid-template-columns: 1fr 1fr;">
            <div><label data-i18n="currency">Curr</label><input id="currencyInput"></div>
            <div><label data-i18n="pack_price">Price</label><input type="number" id="priceInput"></div>
          </div>
          <div class="grid" style="grid-template-columns: 1fr 1fr;">
            <div><label data-i18n="pouches_pack">Pcs</label><input type="number" id="piecesInput"></div>
            <div><label data-i18n="start_limit">Limit</label><input type="number" id="limitInput"></div>
          </div>
          <div id="quitSettings" class="hidden" style="margin-top:10px;">
             <label data-i18n="quit_date">Quit Date</label><input type="date" id="quitDateInput" style="width:100%; padding:8px;">
          </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="saveSettings()" data-i18n="save">Save</button> <button class="btn btn-outline" onclick="document.getElementById('settingsModal').close()" data-i18n="close">Close</button></div>
  </dialog>

  <dialog id="authModal">
    <div class="modal-head" data-i18n="auth_title">Sync</div>
    <div class="modal-body">
      <div id="authSection">
          <div class="grid">
              <input type="email" id="emailInput" placeholder="Email">
              <input type="password" id="passInput" placeholder="Password">
              <button id="loginBtn" class="btn btn-primary" data-i18n="login">Log In</button>
              <button id="googleAuthBtn" class="btn btn-outline" data-i18n="google_login">Google</button>
          </div>
          <div style="text-align:center; margin-top:10px; font-size:13px; color:var(--primary); cursor:pointer;" id="toggleReg" data-i18n="toggle_reg">Register</div>
      </div>
      <div style="border-top:1px solid var(--border); margin-top:20px; padding-top:20px;">
           <div class="grid" style="grid-template-columns: 1fr 1fr;">
              <button id="btnExportCsv" class="btn btn-outline" style="justify-content:center;" data-i18n="export_csv">CSV</button>
              <button id="btnExportJson" class="btn btn-outline" style="justify-content:center;" data-i18n="export_json">Backup</button>
           </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="document.getElementById('authModal').close()" data-i18n="close">Close</button></div>
  </dialog>

  <script type="module">
    import { POUCH_DB } from './data.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, orderBy, Timestamp, writeBatch, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = { apiKey: "AIzaSyBKMDwYeSjmgQLnpYciReSK2yJU0pG6KS8", authDomain: "nicotinepouches-d9d1c.firebaseapp.com", projectId: "nicotinepouches-d9d1c", storageBucket: "nicotinepouches-d9d1c.firebasestorage.app", messagingSenderId: "42131125480", appId: "1:42131125480:web:8022461f0a790a5677855d" };
    const app = initializeApp(firebaseConfig); const analytics = getAnalytics(app); const auth = getAuth(app); const db = getFirestore(app);

    // --- LOCALIZATION ---
    const translations = {
      en: {
        today_usage: "TODAY", streak: "STREAK", money_saved: "SAVED", log_usage: "Log Usage", history: "History", view_all: "View All", 
        settings: "Settings", quit_mode_label: "Enable Quitting", quit_title: "Freedom Journey", achievements: "Achievements",
        export_csv: "📄 CSV Export", export_json: "💾 Backup", google_login: "Google Login", streak_hint: "🔥 Keep it up", nicotine: "Nicotine", 
        total_today: "Total today", cost_label: "Cost", limit_label: "Limit", days_label: "days", daily_max: "DAILY MAX",
        days_left: "{days} left", freedom: "Freedom!", hourly_heatmap: "Hourly Heatmap", history_modal_title: "Full History",
        pick_date: "Pick Date", add_past_entry: "Add Past Entry", history_empty: "No history.", charts_title: "Analytics",
        health_timeline: "Health Recovery", wiz_step1_title: "Goal?", wiz_step2_title: "Strategy", wiz_step3_title: "Setup",
        goal_track_title: "Just Track", goal_quit_title: "I Want to Quit", strat_smooth_title: "Smooth", strat_weekly_title: "Weekly",
        strat_cutoff_title: "Cold Turkey", start_limit: "Daily Limit", target_date: "Target Date", back: "Back", next: "Next", finish: "Finish", 
        data_management: "Data Management", selected_pouch: "Selected", search_placeholder: "Search brand or flavor...", 
        select_placeholder: "Select a pouch...", past_entry_help: "To add past entry, first select a pouch on dashboard.",
        quit_status_active: "Plan active", auth_btn: "Sync / Data", auth_title: "Sync & Backup", login: "Log In", toggle_reg: "Register",
        currency: "Currency", pack_price: "Price/Can", pouches_pack: "Pcs/Can", close: "Close", delete_entry: "Delete", added: "Added!", save: "Save", quit_date: "Quit Date"
      },
      cs: {
        today_usage: "DNES", streak: "ŘADA DNÍ", money_saved: "UŠETŘENO", log_usage: "Zapsat sáček", history: "Historie", view_all: "Zobrazit vše", 
        settings: "Nastavení", quit_mode_label: "Zapnout odvykání", quit_title: "Cesta ke svobodě", achievements: "Úspěchy",
        export_csv: "📄 Export CSV", export_json: "💾 Záloha", google_login: "Google", streak_hint: "🔥 Jen tak dál", nicotine: "Nikotin", 
        total_today: "Celkem dnes", cost_label: "Cena", limit_label: "Limit", days_label: "dní", daily_max: "DENNÍ CÍL",
        days_left: "Zbývá {days}", freedom: "Svoboda!", hourly_heatmap: "Hodinová heatmapa", history_modal_title: "Kompletní historie",
        pick_date: "Vyber datum", add_past_entry: "Přidat zpětně", history_empty: "Žádná historie.", charts_title: "Statistiky",
        health_timeline: "Zdravotní regenerace", wiz_step1_title: "Jaký je cíl?", wiz_step2_title: "Strategie", wiz_step3_title: "Nastavení",
        goal_track_title: "Sledovat", goal_quit_title: "Přestat", strat_smooth_title: "Plynule", strat_weekly_title: "Týdně",
        strat_cutoff_title: "Rázně", start_limit: "Denní Limit", target_date: "Datum konce", back: "Zpět", next: "Další", finish: "Hotovo", 
        data_management: "Správa dat", selected_pouch: "Vybráno", search_placeholder: "Hledat značku nebo příchuť...", 
        select_placeholder: "Vyberte sáček...", past_entry_help: "Pro zpětné vložení nejdřív vyberte sáček na hl. stránce.",
        quit_status_active: "Plán aktivní", auth_btn: "Sync / Data", auth_title: "Záloha dat", login: "Přihlásit", toggle_reg: "Registrovat",
        currency: "Měna", pack_price: "Cena/Puk", pouches_pack: "Ks/Puk", close: "Zavřít", delete_entry: "Smazat", added: "Přidáno!", save: "Uložit", quit_date: "Datum konce"
      }
    };

    const t = (key) => { const lang = state?.lang || 'en'; return translations[lang]?.[key] || translations.en[key] || key; };

    // --- STATE ---
    let state = {
      user: null, lang: localStorage.getItem('nt_lang') || 'en',
      settings: JSON.parse(localStorage.getItem('nt_settings')) || { currency: 'CZK', packPrice: 150, pouchesPerPack: 20, dailyLimit: 10, goal: 'track' },
      history: JSON.parse(localStorage.getItem('nt_history')) || [],
      selection: JSON.parse(localStorage.getItem('nt_last_pouch')) || null
    };
    let currentSearchResults = [];

    function persistHistory() {
      state.history.sort((a, b) => new Date(b.date) - new Date(a.date));
      localStorage.setItem('nt_history', JSON.stringify(state.history));
    }

    // --- LOGIC ---
    function init() {
      applyLanguage(state.lang); persistHistory(); renderUI(); setupSearch(); setupListeners();
      if (!localStorage.getItem('nt_settings')) document.getElementById('settingsModal').showModal();
      if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    }

    function applyLanguage(lang) {
      state.lang = lang; localStorage.setItem('nt_lang', lang); document.getElementById('langBtn').innerText = lang === 'en' ? '🇺🇸 EN' : '🇨🇿 CS';
      document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = t(el.dataset.i18n));
      document.getElementById('searchInput').placeholder = t('search_placeholder');
      renderUI();
    }

    // --- HELPER: FIND REAL MG ---
    // This fixes the issue where old history or bad clicks show "0mg"
    function getRealMg(brand, name, storedMg) {
        if (storedMg && storedMg > 0) return storedMg;
        // Try to find in DB
        const found = POUCH_DB.find(p => p.n === name) || POUCH_DB.find(p => p.b === brand && p.n === name);
        return found ? found.mg : 0;
    }

    function renderUI() {
      const today = new Date().toISOString().slice(0,10);
      const todayEntries = state.history.filter(h => h.date.startsWith(today));
      const limit = state.settings.dailyLimit || 10;
      
      // Favorites - Logic corrected to find item properly
      const counts = {}; state.history.forEach(h => { const k = h.brand + '|' + (h.name||''); counts[k] = (counts[k]||0)+1; });
      const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 3).map(e=>e[0]);
      const container = document.getElementById('quickActions');
      container.innerHTML = top.map(k => { const [b, n] = k.split('|'); return `<div class="quick-chip">${n || b}</div>`; }).join('');
      container.querySelectorAll('.quick-chip').forEach((el, i) => {
          el.onclick = () => {
              const [b, n] = top[i].split('|');
              // Find full object to get mg, fallback to 0 if not found
              const full = POUCH_DB.find(p => p.n === n) || POUCH_DB.find(p => p.b === b && p.n === n) || { b, n, mg: 0 };
              selectPouch(full); addEntry();
          };
      });

      // Selection
      const selName = document.getElementById('selectedPouchName');
      if (state.selection) selName.innerHTML = `${state.selection.n} <span style="color:var(--primary); font-size:11px;">${getRealMg(state.selection.b, state.selection.n, state.selection.mg)}mg</span>`;
      else selName.innerText = t('select_placeholder');

      // Stats (Fixing the 0mg total by using getRealMg)
      document.getElementById('valToday').innerText = todayEntries.length;
      document.getElementById('valLimit').innerText = `${t('limit_label')}: ${limit}`;
      const saved = (limit - todayEntries.length) * (state.settings.packPrice / state.settings.pouchesPerPack);
      document.getElementById('valSaved').innerText = `${Math.max(0, saved).toFixed(0)} ${state.settings.currency}`;
      
      const totalMg = todayEntries.reduce((sum, item) => sum + getRealMg(item.brand, item.name, item.mg), 0);
      document.getElementById('valMg').innerText = `${totalMg.toFixed(1)} mg`;
      
      // History List (Visual Fix for 0mg)
      const list = document.getElementById('historyList'); list.innerHTML = '';
      state.history.slice(0, 5).forEach(h => {
          const realMg = getRealMg(h.brand, h.name, h.mg);
          list.innerHTML += `<div class="history-item"><div><strong>${h.name || h.brand}</strong> <span style="color:var(--muted)">${realMg}mg</span></div><div style="font-size:11px; color:var(--muted);">${new Date(h.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div></div>`;
      });

      renderChart(); renderHourlyChart();
    }

    // --- SEARCH FIX (Index based) ---
    function setupSearch() {
        const input = document.getElementById('searchInput');
        const results = document.getElementById('searchResults');
        
        document.getElementById('openSearchBtn').onclick = () => {
            input.value = ''; 
            currentSearchResults = POUCH_DB.slice(0, 20);
            renderList(currentSearchResults);
            document.getElementById('searchModal').showModal(); input.focus();
        };

        const renderList = (items) => {
            results.innerHTML = items.map((item, index) => `
                <div class="search-item" onclick="window.selectByIndex(${index})">
                    <div><strong>${item.n}</strong><small>${item.b}</small></div>
                    <div class="mg-badge">${item.mg} mg</div>
                </div>
            `).join('');
        };

        window.selectByIndex = (index) => {
             const item = currentSearchResults[index];
             selectPouch(item);
             document.getElementById('searchModal').close();
        };

        input.addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            if (q.length < 1) { renderList([]); return; }
            currentSearchResults = POUCH_DB.filter(p => p.n.toLowerCase().includes(q) || p.b.toLowerCase().includes(q)).slice(0, 50);
            renderList(currentSearchResults);
        });
    }

    function selectPouch(item) {
        state.selection = item;
        localStorage.setItem('nt_last_pouch', JSON.stringify(item));
        renderUI();
    }

    async function addEntry() {
      if(!state.selection) return document.getElementById('openSearchBtn').click();
      let item = state.selection;
      
      // SAFETY CHECK: If mg is 0, try to find it in DB again before saving
      if (!item.mg || item.mg === 0) {
          const found = POUCH_DB.find(p => p.n === item.n) || POUCH_DB.find(p => p.b === item.b && p.n === item.n);
          if (found) item.mg = found.mg;
      }

      const rec = { id: Date.now().toString(), brand: item.b, name: item.n, mg: item.mg, date: new Date().toISOString() };
      state.history.unshift(rec); persistHistory();
      if(state.user) setDoc(doc(db,'users',state.user.uid,'history',rec.id),{ ...rec, timestamp:Timestamp.now() });
      renderUI(); showToast(t('added'));
    }

    // --- SETTINGS LOGIC ---
    window.selectGoal = (g) => { 
        document.querySelectorAll('.selection-card').forEach(c=>c.classList.remove('active')); 
        document.querySelector(`.selection-card[data-val="${g}"]`).classList.add('active');
        document.getElementById('quitSettings').classList.toggle('hidden', g!=='quit');
    };
    window.saveSettings = () => {
        state.settings.currency = document.getElementById('currencyInput').value || 'CZK';
        state.settings.packPrice = parseFloat(document.getElementById('priceInput').value) || 0;
        state.settings.pouchesPerPack = parseFloat(document.getElementById('piecesInput').value) || 20;
        state.settings.dailyLimit = parseInt(document.getElementById('limitInput').value) || 10;
        state.settings.quitDate = document.getElementById('quitDateInput').value;
        state.settings.goal = document.querySelector('.selection-card.active')?.dataset.val || 'track';
        localStorage.setItem('nt_settings', JSON.stringify(state.settings));
        document.getElementById('settingsModal').close(); renderUI();
    };

    // --- HELPERS ---
    function showToast(m) { const t=document.getElementById('toast');t.innerHTML=`<div class="toast-msg">${m}</div>`;setTimeout(()=>t.innerHTML='',2000); }
    
    function renderChart(){
        const days={}; for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i); days[d.toISOString().slice(0,10)]=0;}
        state.history.forEach(h=>{const k=h.date.slice(0,10);if(days[k]!==undefined)days[k]++;});
        const ctx=document.getElementById('trendChart'); if(window.trendChartInst)window.trendChartInst.destroy();
        window.trendChartInst=new Chart(ctx,{type:'line',data:{labels:Object.keys(days).map(d=>d.slice(5)),datasets:[{label:'Pcs',data:Object.values(days),borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.1)',fill:true,tension:0.4}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
    }
    function renderHourlyChart() {
      const hours=Array.from({length:24},(_,i)=>({l:i,c:0}));
      state.history.forEach(h=>hours[new Date(h.date).getHours()].c++);
      const ctx=document.getElementById('hourlyChart'); if(window.hourlyChartInst)window.hourlyChartInst.destroy();
      window.hourlyChartInst=new Chart(ctx,{type:'bar',data:{labels:hours.map(h=>h.l),datasets:[{data:hours.map(h=>h.c),backgroundColor:'#10b981'}]},options:{plugins:{legend:{display:false}},scales:{y:{display:false},x:{grid:{display:false}}}}});
    }

    // --- LISTENERS ---
    function setupListeners() {
      document.getElementById('langBtn').onclick=()=>applyLanguage(state.lang==='en'?'cs':'en');
      document.getElementById('menuBtn').onclick=()=>{
          document.getElementById('currencyInput').value = state.settings.currency;
          document.getElementById('priceInput').value = state.settings.packPrice;
          document.getElementById('piecesInput').value = state.settings.pouchesPerPack;
          document.getElementById('limitInput').value = state.settings.dailyLimit;
          window.selectGoal(state.settings.goal);
          document.getElementById('settingsModal').showModal();
      };
      document.getElementById('syncBtn').onclick=()=>document.getElementById('authModal').showModal();
      document.getElementById('addBtn').onclick=addEntry;
      document.getElementById('viewAllHistoryBtn').onclick=()=>{
          const c=document.getElementById('fullHistoryList'); c.innerHTML='';
          state.history.forEach(h=>{
             const realMg = getRealMg(h.brand, h.name, h.mg);
             c.innerHTML+=`<div class="history-item"><div>${h.name} (${realMg}mg)<br><small>${new Date(h.date).toLocaleString()}</small></div><button class="btn btn-danger" onclick="window.delHist('${h.id}')">${t('delete_entry')}</button></div>`;
          });
          document.getElementById('historyModal').showModal();
      };
      window.delHist = (id) => { state.history=state.history.filter(h=>h.id!==id); persistHistory(); renderUI(); document.getElementById('historyModal').close(); };
      
      // Auth
      document.getElementById('loginBtn').onclick=async()=>{const e=document.getElementById('emailInput').value,p=document.getElementById('passInput').value; try{await signInWithEmailAndPassword(auth,e,p);document.getElementById('authModal').close();}catch{try{await createUserWithEmailAndPassword(auth,e,p);document.getElementById('authModal').close();}catch(err){alert(err.message);}}};
      document.getElementById('googleAuthBtn').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).then(()=>document.getElementById('authModal').close());
      onAuthStateChanged(auth, async (u) => { if(u){ state.user=u; document.getElementById('syncBtn').innerText="✅"; 
        onSnapshot(query(collection(db,'users',u.uid,'history'),orderBy('timestamp','desc')),(s)=>{const h=s.docs.map(d=>({id:d.id, brand:d.data().brand, name:d.data().name||d.data().brand, mg:d.data().mg, date:d.data().timestamp.toDate().toISOString()})); if(h.length){state.history=h;persistHistory();renderUI();}});
      }});
    }

    init();
  </script>
</body>
</html>
